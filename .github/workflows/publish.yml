# Yayın: `android-v*` tag'i push edilince Maven Central'a yükler ve OTOMATİK yayınlar (Portal'da elle
# "Publish" yok), ardından aynı tag için GitHub Release açar.
# Sırlar yalnız repo secrets'tan okunur; koda yazılmaz. Ayrıntı: docs/RELEASE.md
#
# ACTION'LAR TAM COMMIT SHA'SINA SABİTLİDİR: bu iş GPG özel anahtarını ve Central kimliğini env'e
# koyuyor, yani bir action'ın hareketli sürüm etiketi ele geçirilirse sırlar sızar. SHA sabiti etiketin
# gösterdiği yer değişse bile aynı kodu çalıştırır. Sürüm yükseltmesi = SHA'yı ve yanındaki sürüm
# yorumunu birlikte güncellemek. (ci.yml sır kullanmadığı için orada etiket yeterlidir.)
#
# İZİNLER AYRIDIR: Central sırlarını taşıyan `publish` işi yalnız `contents: read` ile koşar. Depoya yazma
# (`contents: write`) yalnız `github-release` işindedir; o iş hiçbir sır görmez ve kod checkout etmez.
name: Maven Central yayını

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Görev, Central dağıtımı PUBLISHED olana kadar bekler (genelde 10-30 dk; plugin'in kendi zaman aşımı 60 dk).
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Tag (android-v1.2.3) ile gradle.properties'teki VERSION_NAME aynı olmalı;
      # yoksa Central'a bir sürüm, context.lib_version'a başka sürüm girer.
      - name: Tag ile VERSION_NAME eşleşmesini doğrula
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#android-v}"
          FILE_VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag sürümü ($TAG_VERSION) gradle.properties VERSION_NAME ($FILE_VERSION) ile eşleşmiyor." >&2
            exit 1
          fi

      # Sessiz atlamayı kapat: sır adı yanlış yazılmış ya da env satırı silinmişse imzasız/kimliksiz yayın
      # denenmez, iş burada anlamlı mesajla düşer. (Gradle'daki imza koşulu yerel imzasız doğrulama içindir.)
      - name: Yayın sırlarının varlığını doğrula
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo secret '$name' boş ya da tanımsız." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::İmzalama anahtarı ya da Central kimliği eksik; imzasız yayın yapılmayacak." >&2
            exit 1
          fi

      - name: Testler ve AAR boyut sınırı
        run: |
          ./gradlew --no-daemon :bir-android:testDebugUnitTest :bir-android-attribution:testDebugUnitTest
          ./scripts/measure-aar.sh

      # publishAndReleaseToMavenCentral: yükler, dağıtımı otomatik yayınlar ve PUBLISHED olana kadar bekler
      # (build.gradle.kts: automaticRelease = true, DeploymentValidation.PUBLISHED). İki modül tek dağıtımdır.
      - name: Maven Central'a yükle ve yayınla
        run: ./gradlew --no-daemon :bir-android:publishAndReleaseToMavenCentral :bir-android-attribution:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  # Yalnız yayın başarılıysa çalışır. Sır görmez, checkout etmez; tek yetkisi Release oluşturmak.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: GitHub Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Yeniden çalıştırmada (re-run) var olan Release'i bozma.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' zaten var; atlanıyor."
            exit 0
          fi
          VERSION="${TAG#android-v}"
          args=(--verify-tag --generate-notes --title "bir-android $VERSION")
          # Ön sürüm (0.2.0-rc.1 gibi) prerelease olarak işaretlenir. Bakılan SÜRÜM kısmıdır: tag önekinin
          # kendisi ('android-v') de '-' içerdiğinden tag'e bakmak her sürümü prerelease yapardı.
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}"
