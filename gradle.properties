# Yayın sürümünün TEK kaynağı. Maven sürümü ve BuildConfig.LIB_VERSION (context.lib_version) buradan beslenir.
# Biçim ve tag kuralı: docs/RELEASE.md
GROUP=com.cizeylem
VERSION_NAME=0.1.0

# Test (Robolectric -> androidx.test) ve örnek uygulamalar AndroidX çekiyor; AGP bu bayrak olmadan
# checkAarMetadata'da düşüyor. Yayınlanan çekirdek AAR'ın bağımlılığını DEĞİŞTİRMEZ (hâlâ sıfır bağımlılık).
android.useAndroidX=true

# Gradle'ın varsayılan yığını (512 MB), iki örnek uygulamanın dex birleştirmesinde ara sıra
# "D8: OutOfMemoryError: Java heap space" ile düşüyordu (CI, ornekler işi). Runner'da 16 GB var.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
