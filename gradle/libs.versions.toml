[versions]
agp = "8.13.2"
# YÜKSELTMEDEN ÖNCE OKU: bu sürüm BİLEREK geride tutuluyor.
# Kotlin metadata'sı ileriye dönük uyumlu DEĞİLDİR: X ile derlenmiş bir kütüphaneyi X'ten
# eski bir derleyici okuyamaz ("binary version of its metadata is X, expected version is Y").
# Yani buradaki sürüm, SDK'yı kullanabilecek uygulamaların ALT SINIRINI belirler — bir
# kütüphanenin müşterisinden daha yeni derleyici dayatması yanlıştır.
# 2.4.21'di; ilk müşteri uygulaması (Kotlin 2.1.20) SDK'yı HİÇ derleyemedi. Ölçüldü: 2.1.20'ye
# inmek 397 testin hiçbirini bozmuyor, 0 uyarı — SDK hiçbir 2.2+ dil özelliği kullanmıyor.
# Yükseltmek, o sürümün altındaki her uygulamayı SESSİZCE dışarıda bırakır.
kotlin = "2.1.20"
robolectric = "4.17"
junit = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-ext = "1.2.1"
compose-bom = "2025.09.00"
activity-compose = "1.10.1"
leanback = "1.0.0"
maven-publish = "0.37.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
leanback = { module = "androidx.leanback:leanback", version.ref = "leanback" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
